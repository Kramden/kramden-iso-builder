name: Build ISO and Disk Image

on:
  schedule:
    # Every Saturday at 2am
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: release-vars
        id: release-vars
        run: |
          sudo apt install -y curl jq
          # Pin to the 24.04 series but resolve the latest point release
          # dynamically -- hardcoding e.g. "24.04.5" breaks the next time
          # Ubuntu ships a point release under a different version key
          # (as happened when 24.04.5 was superseded by 24.04.5.1).
          stream=$(curl -sL https://releases.ubuntu.com/streams/v1/com.ubuntu.releases:ubuntu.json)
          version=$(echo "$stream" | jq -r '.products["com.ubuntu.releases:ubuntu:desktop:24.04:amd64"].versions | keys | sort_by(split(".") | map(tonumber)) | last')
          iso_path=$(echo "$stream" | jq -r --arg v "$version" '.products["com.ubuntu.releases:ubuntu:desktop:24.04:amd64"].versions[$v].items.iso.path')
          echo URL=https://releases.ubuntu.com/$iso_path >> "$GITHUB_OUTPUT"
          echo FILENAME=$(basename "$iso_path") >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@3e0187054f9c4bc1f55a743792872df36b2d88e0
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - name: install livefs-editor
        run: |
          git clone https://github.com/mwhudson/livefs-editor
          cd livefs-editor/
          sudo python3 -m pip install . --break-system-packages
          sudo apt update --fix-missing
          sudo apt install -y xorriso squashfs-tools python3-debian mount
      - name: Fetch base ISO
        id: download
        uses: mercury233/action-cache-download-file@v1.0.0
        with:
          url: ${{ steps.release-vars.outputs.URL }}
          destination: ${{ github.workspace }}
          filename: ${{ steps.release-vars.outputs.FILENAME }}
      - name: Build Kramden ISO
        id: build-iso
        env:                                                                      
          SORTLY_API_KEY: ${{ secrets.SORTLY_API_KEY }}
          SORTLY_FOLDER_LOOKUP_API_KEY: ${{ secrets.SORTLY_FOLDER_API_KEY }}
          SORTLY_FOLDER_LOOKUP_URL: ${{ secrets.SORTLY_FOLDER_LOOKUP_URL }}
        run: |
          sudo apt install -y ubuntu-dev-tools wget
          cd noble
          echo ${{ github.workspace }}
          echo "list ISO"
          ls -ltrh ${{ steps.download.outputs.filepath }} || true
          echo "list dir"
          ls -ltrh ${{ github.workspace }} || true
          sed -e "s|@@SORTLY_API_KEY@@|$SORTLY_API_KEY|g" \
              -e "s|@@SORTLY_FOLDER_LOOKUP_API_KEY@@|$SORTLY_FOLDER_LOOKUP_API_KEY|g" \
              -e "s|@@SORTLY_FOLDER_LOOKUP_URL@@|$SORTLY_FOLDER_LOOKUP_URL|g" \
              autoinstall.yaml.in > autoinstall.yaml
          sudo ./kramden.sh ${{ steps.download.outputs.filepath }}
          echo RELEASE_NAME=$(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))>> "$GITHUB_OUTPUT"
          echo $(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))
          cd ${{ github.workspace }}
      - name: Save ISO
        uses: actions/upload-artifact@v4
        with:
          name: kramden-iso
          path: ${{ github.workspace }}/kramden*.iso
          retention-days: 15
      - name: Build Kramden Image
        run: |
          sudo apt update --fix-missing
          sudo apt install -y qemu-system-x86 qemu-utils zstd coreutils ovmf
          echo "list ISO"
          ls -ltrh ${{ github.workspace }} || true
          export RELEASE_NAME=$(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))
          export ISO=$RELEASE_NAME.iso
          export IMG=$RELEASE_NAME.qcow2
          echo $ISO
          echo $IMG
          sudo ./noble/autoinstall.sh $ISO ${{ github.workspace }}/$IMG
          zstd ${{ github.workspace }}/$IMG
          sha512sum $IMG.zst > ${{ github.workspace }}/$IMG.zst.sha512
          echo "list files"
          ls -ltrh ${{ github.workspace }} || true
      - name: Save Image
        uses: actions/upload-artifact@v4
        with:
          name: kramden-img
          path: ${{ github.workspace }}/kramden*.qcow2.*
          retention-days: 15
