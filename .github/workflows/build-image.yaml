name: Build ISO and Disk Image

on:
  schedule:
    # Every Saturday at 2am
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-24.04
    steps:
      - name: release-vars
        id: release-vars
        run: |
          sudo apt install -y curl jq
          echo URL=$(echo https://releases.ubuntu.com/$(curl -sL https://releases.ubuntu.com/streams/v1/com.ubuntu.releases:ubuntu.json | jq '.products["com.ubuntu.releases:ubuntu:desktop:26.04:amd64"].versions["26.04"].items.iso.path' | sed 's/\"//g')) >> "$GITHUB_OUTPUT"
          echo FILENAME=$(echo $(curl -sL https://releases.ubuntu.com/streams/v1/com.ubuntu.releases:ubuntu.json | jq '.products["com.ubuntu.releases:ubuntu:desktop:26.04:amd64"].versions["26.04"].items.iso.path' | sed 's/\"//g' | awk -F / '{print $2}')) >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@3e0187054f9c4bc1f55a743792872df36b2d88e0
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - name: install livefs-editor
        run: |
          git clone https://github.com/mwhudson/livefs-editor
          cd livefs-editor/
          # The base ISO ships a cdrom apt source that can't be reached from
          # inside the mounted squashfs. python-apt's Cache.update() raises
          # FetchFailedException on any source failure (unlike apt-get,
          # which just warns), which aborts add-packages-to-pool before it
          # ever produces an output ISO. Swallow it like apt-get does; the
          # packages we need still come from sources that do succeed.
          python3 - <<'PATCH'
          path = "livefs_edit/actions.py"
          with open(path) as f:
              content = f.read()
          old = "        cache.update(AcquireProgress())\n    cache.open()"
          new = (
              "        try:\n"
              "            cache.update(AcquireProgress())\n"
              "        except Exception:\n"
              "            pass\n"
              "    cache.open()"
          )
          assert content.count(old) == 1, f"expected 1 match, found {content.count(old)}"
          content = content.replace(old, new)
          with open(path, "w") as f:
              f.write(content)
          PATCH
          # resign_pool() re-signs the /cdrom pool's Release file with a
          # fresh one-time key after each add-packages/add-debs-to-pool
          # call, and trusts that key by dropping it into
          # /etc/apt/trusted.gpg.d in one squashfs layer. That's not
          # enough on this base ISO: casper's auto-generated
          # /etc/apt/sources.list.d/cdrom.sources pins an inline
          # Signed-By key block (the *real* Ubuntu archive key, baked
          # in at image build time) which bypasses the trusted.gpg.d
          # scan entirely for that source. So no matter what we trust
          # globally, apt-get update in-target still fails with
          # NO_PUBKEY on file:/cdrom, since it's checking the pool's
          # new signature against the old, unrelated archive key.
          # Trust the new key in every squashfs that actually exists
          # in casper/ (rather than a guessed single layer name) *and*
          # rewrite cdrom.sources' Signed-By to reference it.
          python3 - <<'PATCH'
          path = "livefs_edit/actions.py"
          with open(path) as f:
              content = f.read()
          old = (
              "    new_fs = ctxt.edit_squashfs(get_squash_names(ctxt)[0])\n"
              "    key_path = f'{new_fs}/etc/apt/trusted.gpg.d/custom-iso-key.gpg'\n"
              "    with open(key_path, 'w') as new_key:\n"
              "        ctxt.run(['gpg', '--home', gpghome, '--export'], stdout=new_key)\n"
          )
          new = (
              "    armored_key = ctxt.run(\n"
              "        ['gpg', '--home', gpghome, '--armor', '--export'],\n"
              "        stdout=subprocess.PIPE).stdout.decode()\n"
              "    # deb822 multi-line values may not end in a newline, may\n"
              "    # not contain literal blank lines (a lone '.' stands in\n"
              "    # for one), and every line after the first must be\n"
              "    # indented -- reproduce that framing around the armor\n"
              "    # block ourselves.\n"
              "    key_lines = armored_key.strip('\\n').splitlines()\n"
              "    signed_by = key_lines[0] + '\\n' + '\\n'.join(\n"
              "        ' ' + (ln if ln else '.') for ln in key_lines[1:])\n"
              "\n"
              "    for squash_name in get_all_squash_names(ctxt):\n"
              "        new_fs = ctxt.edit_squashfs(squash_name, add_sys_mounts=False)\n"
              "        key_dir = f'{new_fs}/etc/apt/trusted.gpg.d'\n"
              "        if os.path.isdir(key_dir):\n"
              "            key_path = f'{key_dir}/custom-iso-key.gpg'\n"
              "            with open(key_path, 'w') as new_key:\n"
              "                ctxt.run(\n"
              "                    ['gpg', '--home', gpghome, '--export'],\n"
              "                    stdout=new_key)\n"
              "        cdrom_sources = (\n"
              "            f'{new_fs}/etc/apt/sources.list.d/cdrom.sources')\n"
              "        if os.path.exists(cdrom_sources):\n"
              "            from debian import deb822\n"
              "            with open(cdrom_sources) as f:\n"
              "                stanza = deb822.Deb822(f)\n"
              "            stanza['Signed-By'] = signed_by\n"
              "            with open(cdrom_sources, 'wb') as f:\n"
              "                stanza.dump(f)\n"
          )
          assert content.count(old) == 1, f"expected 1 match, found {content.count(old)}"
          content = content.replace(old, new)
          with open(path, "w") as f:
              f.write(content)
          PATCH
          sudo python3 -m pip install . --break-system-packages
          sudo apt update --fix-missing
          sudo apt install -y xorriso squashfs-tools python3-debian mount
      - name: Fetch base ISO
        id: download
        uses: mercury233/action-cache-download-file@v1.0.0
        with:
          url: ${{ steps.release-vars.outputs.URL }}
          destination: ${{ github.workspace }}
          filename: ${{ steps.release-vars.outputs.FILENAME }}
      - name: Build Kramden ISO
        id: build-iso
        env:                                                                      
          SORTLY_API_KEY: ${{ secrets.SORTLY_API_KEY }}            
        run: |
          sudo apt install -y ubuntu-dev-tools wget
          cd resolute
          echo ${{ github.workspace }}
          echo "list ISO"
          ls -ltrh ${{ steps.download.outputs.filepath }} || true
          echo "list dir"
          ls -ltrh ${{ github.workspace }} || true
          sed "s|@@SORTLY_API_KEY@@|$SORTLY_API_KEY|g" autoinstall.yaml.in > autoinstall.yaml
          sudo ./kramden.sh ${{ steps.download.outputs.filepath }}
          echo RELEASE_NAME=$(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))>> "$GITHUB_OUTPUT"
          echo $(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))
          cd ${{ github.workspace }}
      - name: DEBUG verify autoinstall wiring
        run: |
          ISO=$(ls -t ${{ github.workspace }}/kramden*.iso | head -n1)
          echo "Inspecting $ISO"
          mkdir -p /tmp/isocheck
          xorriso -indev "$ISO" -osirrox on -extract /autoinstall.yaml /tmp/isocheck/autoinstall.yaml -extract /boot/grub/grub.cfg /tmp/isocheck/grub.cfg
          echo "=== autoinstall.yaml present? ==="
          ls -la /tmp/isocheck/autoinstall.yaml || echo "MISSING"
          echo "=== autoinstall.yaml size/head ==="
          wc -l /tmp/isocheck/autoinstall.yaml || true
          head -5 /tmp/isocheck/autoinstall.yaml || true
          echo "=== grub.cfg linux/--- lines ==="
          grep -n -- '---' /tmp/isocheck/grub.cfg || echo "NO --- LINES FOUND"
          echo "=== grub.cfg autoinstall occurrences ==="
          grep -n "autoinstall" /tmp/isocheck/grub.cfg || echo "NO autoinstall STRING FOUND IN GRUB.CFG"
          echo "=== full grub.cfg menuentry blocks ==="
          grep -n -A3 "menuentry " /tmp/isocheck/grub.cfg || true
      - name: Save ISO
        uses: actions/upload-artifact@v4
        with:
          name: kramden-iso
          path: ${{ github.workspace }}/kramden*.iso
          retention-days: 15
      - name: Build Kramden Image
        run: |
          sudo apt update --fix-missing
          sudo apt install -y qemu-system-x86 qemu-utils zstd coreutils
          echo "list ISO"
          ls -ltrh ${{ github.workspace }} || true
          export RELEASE_NAME=$(basename $(ls -t $PWD/kramden*amd64.iso | head -n1 | sed 's/.iso//'g))
          export ISO=$RELEASE_NAME.iso
          export IMG=$RELEASE_NAME.qcow2
          echo $ISO
          echo $IMG
          sudo ./resolute/autoinstall.sh $ISO ${{ github.workspace }}/$IMG
          zstd ${{ github.workspace }}/$IMG
          sha512sum $IMG.zst > ${{ github.workspace }}/$IMG.zst.sha512
          echo "list files"
          ls -ltrh ${{ github.workspace }} || true
      - name: Save Image
        uses: actions/upload-artifact@v4
        with:
          name: kramden-img
          path: ${{ github.workspace }}/kramden*.qcow2.*
          retention-days: 15
